CONFIG_MY_AWESOME_KEYBOARD_SPECIAL_FEATURE=y

CONFIG_ZMK_STUDIO_RPC_PERF=y

# The split-relay perf response runs on ZMK's low-priority work queue; its
# serialize/report chain needs more stack than the queue's default (see the
# BUILD_ASSERT in perf_handler.c). Scales with CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

CONFIG_ZMK_STUDIO_LOCKING=n
# CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=30
# CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=64

# Disable console by default to disable board_cdc_acm_uart
# CONSOLE is enabled when -S zmk-usb-logging is specified
CONFIG_CONSOLE=n
