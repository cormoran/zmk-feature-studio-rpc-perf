# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk
      remote: cormoran
      revision: main+custom-studio-protocol
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zmk-west-commands
      remote: cormoran
      # Pinned to the USB-OUT-endpoint-rearm branch (cormoran PR #30) rather than
      # main: it fixes a DualCdcAcmBridge model bug where only the FIRST
      # device->host chunk per session was delivered (the re-arm was clobbered by
      # HandlePacket's trailing dataCallback=null). The USB perf sweeps REQUIRE
      # this fix to measure true limits; revert to `main` once #30 merges.
      revision: claude/usb-out-endpoint-rearm
      import: true
